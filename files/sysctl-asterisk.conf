# UDP buffer sizes
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# Connection tracking
net.core.netdev_max_backlog = 65536
net.core.somaxconn = 65536

# File descriptor limits
fs.file-max = 1048576

# Network tuning
net.ipv4.udp_mem = 65536 131072 262144

# keep the ephemeral range off the RTP ports, or an outbound socket steals one
# and the call comes up with no audio
net.ipv4.ip_local_reserved_ports = 10000-20000
net.ipv4.ip_local_port_range = 20001 65000

# no nf_conntrack_helper, kernel 6.0 removed it
