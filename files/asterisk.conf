[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
[options]
runuser = asterisk
rungroup = asterisk
; No minmemfree on purpose. Asterisk compares it against free RAM, and on Linux
; that stays low because the kernel uses whatever is spare as page cache. On a
; 4 GB box with 3 GB of cache the watermark trips and Asterisk quietly refuses
; every call: originate returns success, no channel is created, and the only
; clue is one WARNING from pbx.c about the low watermark.
