[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
[options]
runuser = asterisk
rungroup = asterisk
; as in freepbx's own asterisk.conf, which never lands because ours is there first
transmit_silence_during_record = yes
languageprefix = yes
execincludes = yes
dontwarn = yes
; no minmemfree on purpose, it is measured against free RAM and the page cache
; keeps that low, so it ends up refusing every call with no error anywhere
[files]
astctlpermissions = 775
